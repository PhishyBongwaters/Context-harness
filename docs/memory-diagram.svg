<!--
  DESIGN DOC — keep true.
  This diagram is a design document for the context-harness memory
  architecture: the pointer machine that makes the loop work.
  Update it whenever the memory layout changes. Sources of truth:
    harness/session.py  (SAT_FILES, INDEX_TEMPLATE, HISTORY_TEMPLATE)
    harness/loop.py     (_close_episode, _backup_context, _trim_handoff_backstop)
    harness/assembly.py (blank-slate assembly order)
  Rendered at 1040x1320. Dark LCARS-flavored theme to match the TUI.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1320" viewBox="0 0 1040 1320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="marrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5a6b82"/>
    </marker>
    <style>
      .title { font-size: 32px; font-weight: 800; letter-spacing: 8px; fill: #f0f4fa; }
      .subtitle { font-size: 14px; fill: #8a94a6; }
      .pill { font-size: 12.5px; font-weight: 700; letter-spacing: 2px; }
      .boxtitle { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; }
      .body { font-size: 12.5px; fill: #c9d3e2; }
      .code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12px; fill: #c9d3e2; }
      .note { font-size: 11px; fill: #6b7688; }
      .foot { font-size: 13px; font-style: italic; fill: #8a94a6; }
      .gold { fill: #e8b93e; }
      .ptitle { font-size: 12px; font-weight: 800; letter-spacing: 1px; fill: #dbe7f5; }
      .pline { font-size: 11.5px; fill: #9aa4b5; }
    </style>
  </defs>

  <rect width="1040" height="1320" fill="#0a0e14"/>

  <!-- Title -->
  <text x="520" y="54" text-anchor="middle" class="title">THE MEMORY</text>
  <text x="520" y="82" text-anchor="middle" class="subtitle">the pointer machine that makes the loop work</text>

  <!-- CPU analogy pills -->
  <g>
    <rect x="150" y="104" width="200" height="36" rx="18" fill="#2a1f14" stroke="#e08a3c" stroke-width="1.5"/>
    <text x="250" y="127" text-anchor="middle" class="pill" fill="#e8a45c">sats = L1</text>
    <rect x="410" y="104" width="220" height="36" rx="18" fill="#14202f" stroke="#5b8dd9" stroke-width="1.5"/>
    <text x="520" y="127" text-anchor="middle" class="pill" fill="#7ba7e0">history = RAM</text>
    <rect x="690" y="104" width="200" height="36" rx="18" fill="#1a1626" stroke="#7a6ba8" stroke-width="1.5"/>
    <text x="790" y="127" text-anchor="middle" class="pill" fill="#a99ae0">archive = disk</text>
  </g>

  <!-- ============ L1 · SATS ============ -->
  <g>
    <rect x="120" y="170" width="560" height="290" rx="10" fill="#2a1f14" stroke="#e08a3c" stroke-width="1.5"/>
    <text x="140" y="198" class="boxtitle" fill="#e8a45c">L1 · SATS/ — the working set</text>
    <text x="660" y="198" text-anchor="end" class="note">HOT · ~2k tokens · every turn</text>

    <rect x="140" y="212" width="520" height="62" rx="8" fill="#2a2113" stroke="#d9a53b" stroke-width="1.5"/>
    <text x="156" y="236" class="body gold" font-weight="700">handoff.md — the shift board</text>
    <text x="156" y="256" class="pline">Now / Next / Blockers / Pointers — rewritten every turn</text>

    <text x="140" y="300" class="body">current.md — the active task</text>
    <text x="140" y="322" class="body">goals · facts · decisions · tasks — durable one-liners</text>
    <text x="140" y="344" class="body">hypotheses.md — half-formed ideas</text>
    <text x="140" y="364" class="note">promote to facts when confirmed, delete when disproven</text>

    <line x1="140" y1="382" x2="660" y2="382" stroke="#3a2c1c" stroke-width="1"/>
    <text x="140" y="406" class="note">model-curated · machine-verified · budget-governed</text>
    <text x="140" y="426" class="note">assembled first, every turn — there is no other memory</text>
  </g>

  <line x1="200" y1="460" x2="200" y2="488" stroke="#5a6b82" stroke-width="2" marker-end="url(#marrow)"/>
  <text x="212" y="482" class="note">episode close -&gt; pointers</text>

  <!-- ============ L2 · HISTORY ============ -->
  <g>
    <rect x="120" y="492" width="560" height="150" rx="10" fill="#14202f" stroke="#5b8dd9" stroke-width="1.5"/>
    <text x="140" y="520" class="boxtitle" fill="#7ba7e0">L2 · HISTORY.MD — the stamped record</text>
    <text x="660" y="520" text-anchor="end" class="note">WARM · curated transcript</text>
    <text x="140" y="548" class="code">## user tNNNN — a user message opens the turn, stamped</text>
    <text x="140" y="570" class="code">## auto tNNNN — the harness opens the turn (auto-continue), stamped</text>
    <text x="140" y="592" class="code">## episode tNNNN — closing reply (H1) + pointer to archived scratch</text>
    <text x="140" y="614" class="body">windowing (H2) — recent episodes in full, older collapse to pointers</text>
    <text x="140" y="636" class="note">episodes are never rewritten, only windowed</text>
  </g>

  <line x1="200" y1="642" x2="200" y2="670" stroke="#5a6b82" stroke-width="2" marker-end="url(#marrow)"/>
  <text x="212" y="664" class="note">prune -&gt; dated logs</text>

  <!-- ============ L3 · ARCHIVE ============ -->
  <g>
    <rect x="120" y="674" width="560" height="170" rx="10" fill="#1a1626" stroke="#7a6ba8" stroke-width="1.5"/>
    <text x="140" y="702" class="boxtitle" fill="#a99ae0">L3 · ARCHIVE/ — cold storage</text>
    <text x="660" y="702" text-anchor="end" class="note">COLD · deliberate re-read only</text>
    <text x="140" y="730" class="code">context.archive-&lt;ts&gt;.md — pruned-away sections</text>
    <text x="140" y="752" class="code">handoff.pre-handoff-trim-&lt;ts&gt;.bak — kept beside the file</text>
    <text x="140" y="774" class="body">never deleted by the loop</text>
    <text x="140" y="798" class="note">the loop never pulls from here unasked — re-read on purpose</text>
  </g>

  <!-- re-read arrow (right side, up) -->
  <line x1="710" y1="844" x2="710" y2="460" stroke="#5a6b82" stroke-width="2" marker-end="url(#marrow)"/>
  <text x="714" y="652" class="note" transform="rotate(-90 714 652)" text-anchor="middle">re-read on purpose</text>

  <!-- ============ RIGHT: THE POINTERS ============ -->
  <text x="740" y="196" class="pill" fill="#6b7688">THE POINTERS</text>
  <text x="740" y="212" class="note">nothing is ever gone</text>
  <g>
    <rect x="740" y="224" width="240" height="92" rx="8" fill="#11161f" stroke="#2a3342" stroke-width="1.5"/>
    <text x="754" y="248" class="ptitle">episode close</text>
    <text x="754" y="268" class="pline">scratch.md -&gt; archive/&lt;dated&gt;.md</text>
    <text x="754" y="286" class="pline">## episode pointer -&gt; history.md</text>

    <rect x="740" y="326" width="240" height="92" rx="8" fill="#11161f" stroke="#2a3342" stroke-width="1.5"/>
    <text x="754" y="350" class="ptitle">windowing (H2)</text>
    <text x="754" y="370" class="pline">older episodes collapse to pointers</text>
    <text x="754" y="388" class="pline">recent stays in full</text>

    <rect x="740" y="428" width="240" height="92" rx="8" fill="#11161f" stroke="#2a3342" stroke-width="1.5"/>
    <text x="754" y="452" class="ptitle">handoff Pointers</text>
    <text x="754" y="472" class="pline">aims at index anchors + archive logs</text>
    <text x="754" y="490" class="pline">assembles first — L1</text>

    <rect x="740" y="530" width="240" height="92" rx="8" fill="#11161f" stroke="#2a3342" stroke-width="1.5"/>
    <text x="754" y="554" class="ptitle">hypotheses</text>
    <text x="754" y="574" class="pline">promote to facts when confirmed</text>
    <text x="754" y="592" class="pline">delete when disproven</text>

    <rect x="740" y="632" width="240" height="92" rx="8" fill="#11161f" stroke="#2a3342" stroke-width="1.5"/>
    <text x="754" y="656" class="ptitle">prune ladder</text>
    <text x="754" y="676" class="pline">scratch sections -&gt; archive/</text>
    <text x="754" y="694" class="pline">nothing lost, only cooled</text>

    <rect x="740" y="734" width="240" height="92" rx="8" fill="#11161f" stroke="#2a3342" stroke-width="1.5"/>
    <text x="754" y="758" class="ptitle">handoff.json</text>
    <text x="754" y="778" class="pline">per-turn line/token ledger</text>
    <text x="754" y="796" class="pline">the dumping canary</text>
  </g>

  <!-- ============ INDEX.MD — HOLY ============ -->
  <g>
    <rect x="120" y="874" width="860" height="86" rx="10" fill="#221b0e" stroke="#d9a53b" stroke-width="1.5"/>
    <text x="140" y="902" class="boxtitle gold">index.md — HOLY · harness-owned pointer map</text>
    <text x="140" y="926" class="body">## satellites + ## episodes — the model reads it; only the harness writes it</text>
    <text x="140" y="944" class="note">stable anchors into sats/* and history.md — must be pure</text>
  </g>

  <!-- ============ SCRATCH / CONTEXT ============ -->
  <g>
    <rect x="120" y="990" width="860" height="100" rx="10" fill="#10151d" stroke="#3a4456" stroke-width="1.5"/>
    <text x="140" y="1018" class="boxtitle" fill="#9aa4b5">scratch.md</text>
    <text x="140" y="1040" class="body">this turn's working notes — tool calls and results</text>
    <text x="140" y="1060" class="note">archived at episode close</text>
    <line x1="550" y1="1004" x2="550" y2="1076" stroke="#2a3342" stroke-width="1"/>
    <text x="570" y="1018" class="boxtitle" fill="#9aa4b5">context.md</text>
    <text x="570" y="1040" class="body">the assembled artifact — what the model sees</text>
    <text x="570" y="1060" class="note">build output, rebuilt every turn, never edited</text>
  </g>

  <!-- Footer -->
  <text x="520" y="1142" text-anchor="middle" class="foot">A 50k-token working turn collapses to ~2k — and anything archived can be re-read deliberately.</text>

  <!-- Legend -->
  <g font-size="12" fill="#8a94a6">
    <rect x="252" y="1172" width="14" height="14" rx="3" fill="#2a1f14" stroke="#e08a3c"/>
    <text x="272" y="1184">L1 hot</text>
    <rect x="348" y="1172" width="14" height="14" rx="3" fill="#14202f" stroke="#5b8dd9"/>
    <text x="368" y="1184">L2 warm</text>
    <rect x="458" y="1172" width="14" height="14" rx="3" fill="#1a1626" stroke="#7a6ba8"/>
    <text x="478" y="1184">L3 cold</text>
    <rect x="562" y="1172" width="14" height="14" rx="3" fill="#221b0e" stroke="#d9a53b"/>
    <text x="582" y="1184">holy</text>
    <rect x="644" y="1172" width="14" height="14" rx="3" fill="#11161f" stroke="#2a3342"/>
    <text x="664" y="1184">pointer</text>
  </g>
</svg>
